# Cloud Functions 수동 배포 (workflow_dispatch 전용 — 자동 트리거 없음).
# 2026-07 대시보드 트리거 retry storm 수정을 배포하기 위해 도입.
# 인증: FIREBASE_TOKEN(로컬에서 `firebase login:ci`로 생성) 또는
# GCP_SA_KEY(배포 권한이 있는 서비스 계정 JSON) 저장소 시크릿 중 하나.
name: Deploy Cloud Functions

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "firebase deploy --only 대상"
        required: false
        default: "functions:dashboardOnWorkoutWritten,functions:dashboardOnSettingWritten,functions:dashboardOnBodyCheckinWritten,functions:dashboardOnExerciseWritten"
      delete_refresh_weekly_ranking:
        description: "무인증 refreshWeeklyRanking 함수 삭제 (us-central1)"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        run: npm --prefix functions ci --no-audit --no-fund

      - name: Run functions tests
        run: npm --prefix functions test

      - name: Resolve Firebase credentials
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"
            echo "서비스 계정(GCP_SA_KEY)으로 인증합니다."
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN으로 인증합니다."
          else
            echo "::error::FIREBASE_TOKEN 또는 GCP_SA_KEY 저장소 시크릿이 필요합니다. 로컬에서 'firebase login:ci'를 실행해 나온 토큰을 GitHub 저장소 Settings > Secrets and variables > Actions에 FIREBASE_TOKEN으로 등록하세요."
            exit 1
          fi

      # firebase deploy는 --only로 대상을 좁혀도 코드베이스 전체의 defineSecret
      # 파라미터에 버전이 있는지 검증한다. TOMATO_SYNC_PEER_SERVICE_ACCOUNT는
      # 아직 실값(TomatoDev 서비스 계정)이 없으므로, 버전이 없으면 "미구성"
      # 플레이스홀더를 채워 검증을 통과시킨다. 런타임은 이 값을 동기화 비활성으로
      # 처리한다(functions/index.js mirrorTomatoDocument의 sync-unconfigured 가드).
      - name: Seed placeholder for unconfigured sync secret
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if npx --yes firebase-tools functions:secrets:access TOMATO_SYNC_PEER_SERVICE_ACCOUNT \
            --project exercise-management >/dev/null 2>&1; then
            echo "TOMATO_SYNC_PEER_SERVICE_ACCOUNT: 기존 버전 존재 — 그대로 사용"
          else
            printf '{"disabled":true}' > "$RUNNER_TEMP/sync-secret-placeholder.json"
            npx --yes firebase-tools functions:secrets:set TOMATO_SYNC_PEER_SERVICE_ACCOUNT \
              --data-file "$RUNNER_TEMP/sync-secret-placeholder.json" \
              --project exercise-management --non-interactive
            echo "TOMATO_SYNC_PEER_SERVICE_ACCOUNT: 미구성 플레이스홀더 버전 생성"
          fi

      - name: Deploy targeted functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx --yes firebase-tools deploy \
            --only "${{ github.event.inputs.targets }}" \
            --project exercise-management \
            --non-interactive --force

      - name: Delete refreshWeeklyRanking
        if: ${{ github.event.inputs.delete_refresh_weekly_ranking == 'true' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set +e
          out=$(npx --yes firebase-tools functions:delete refreshWeeklyRanking \
            --region us-central1 --project exercise-management --force 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -qiE "not found|does not exist|failed to find|do not match any existing functions"; then
            echo "refreshWeeklyRanking 함수가 이미 없습니다 — 건너뜁니다."
            exit 0
          fi
          exit $code
