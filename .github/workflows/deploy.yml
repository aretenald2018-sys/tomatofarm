name: Verify Pages Runtime Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-runtime-assets"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the live owner registry and applies the client's own acceptance
      # rule. No repository variable to set, and no way to attest past a record
      # the app would actually reject.
      - name: Verify shared account SSOT release gate
        run: node scripts/verify-shared-owner-release-gate.mjs

      - name: Verify project governance
        run: node scripts/check-project-governance.mjs

      - name: Verify generated CSS
        run: node scripts/generate-style-entry.mjs --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate build info
        run: node scripts/generate-build-info.mjs

      - name: Verify runtime assets
        run: node scripts/verify-runtime-assets.mjs

      # 게시된 APK 가 이번 배포의 웹 자산과 같은 코드를 담고 있는지 본다. APK 재빌드는
      # 고정 debug 키가 있는 기기에서만 가능해서(CI 러너는 매번 새 키를 만들고, 다르게
      # 서명된 빌드는 기존 설치 위에 덮이지 않는다) 이 검사가 배포를 막으면 mobile 과
      # 무관한 웹 변경까지 APK 재빌드를 기다려야 한다. 그래서 경고로만 남긴다.
      # 대가: APK 를 재빌드하기 전까지 웹은 새 코드, 내려받는 APK 는 옛 코드다.
      - name: Verify downloadable APK runtime assets
        continue-on-error: true
        run: node scripts/verify-apk-runtime-assets.mjs --apk public/downloads/tomato-mobile-debug.apk

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
